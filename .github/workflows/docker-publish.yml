name: Publish container image

# Builds an immutable git tag and pushes linux/amd64 to GHCR.
# Create release calls this after the tag exists. workflow_dispatch can
# publish an existing tag without creating another GitHub Release.
# An existing GHCR version tag is not replaced unless allow_overwrite is set.
# The first push creates a private package. An owner must make it public
# once before anonymous docker pull works. GITHUB_TOKEN cannot do that.

on:
  workflow_call:
    inputs:
      version:
        description: Immutable git tag to publish, for example v2.2.5
        required: true
        type: string
      update_latest:
        description: Also move the latest tag
        required: true
        type: boolean
      allow_overwrite:
        description: Replace an existing GHCR version tag
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: Existing git tag to publish, for example v2.2.5
        required: true
        type: string
      update_latest:
        description: Also move latest. Leave false when publishing an older tag.
        required: true
        default: false
        type: boolean
      allow_overwrite:
        description: Replace an existing GHCR version tag. Leave false.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  checks: read
  packages: write

concurrency:
  group: ghcr-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi
          found=false
          for _ in 1 2 3 4 5 6; do
            if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${VERSION}" >/dev/null; then
              found=true
              break
            fi
            sleep 5
          done
          if [[ "$found" != "true" ]]; then
            echo "Tag ${VERSION} was not found. Refusing to build from a branch." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}

      - name: Require tag to match version.py
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          code_version="$(tr -d '\r' < version.py | sed -n 's/^VERSION = "\(.*\)"$/\1/p')"
          if [[ "$VERSION" != "v${code_version}" ]]; then
            echo "version.py is ${code_version}; refusing to publish ${VERSION}" >&2
            exit 1
          fi

      - name: Require successful checks on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100")"
          echo "$checks" | jq -r '.check_runs | sort_by(.name, .started_at) | group_by(.name)[] | last | select(.name != "create tagged release" and .name != "publish GHCR image" and .name != "publish container image") | [.name, .status, (.conclusion // "")] | @tsv'
          count="$(echo "$checks" | jq '[.check_runs | sort_by(.name, .started_at) | group_by(.name)[] | last | select(.name != "create tagged release" and .name != "publish GHCR image" and .name != "publish container image")] | length')"
          bad="$(echo "$checks" | jq '[.check_runs | sort_by(.name, .started_at) | group_by(.name)[] | last | select(.name != "create tagged release" and .name != "publish GHCR image" and .name != "publish container image") | select(.status != "completed" or .conclusion != "success")] | length')"
          [[ "$count" -gt 0 && "$bad" -eq 0 ]] || { echo "All CI checks on the tagged commit must pass before publishing an image." >&2; exit 1; }

      - name: Resolve image tags
        id: meta
        env:
          VERSION: ${{ inputs.version }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          tags="${image}:${VERSION}"
          if [[ "$UPDATE_LATEST" == "true" ]]; then
            tags="${tags}"$'\n'"${image}:latest"
          fi
          printf '%s\n' "$tags" > "$RUNNER_TEMP/image-tags.txt"
          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v4

      - name: Refuse to overwrite a published version tag
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ inputs.version }}
          ALLOW_OVERWRITE: ${{ inputs.allow_overwrite }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            if [[ "$ALLOW_OVERWRITE" != "true" ]]; then
              echo "GHCR tag ${IMAGE}:${VERSION} already exists. Refusing to overwrite a published version." >&2
              exit 1
            fi
            echo "Replacing existing GHCR tag ${IMAGE}:${VERSION} because allow_overwrite=true."
          fi

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.title=buddy2api
            org.opencontainers.image.description=Local OpenAI-compatible gateway for personal AI client sessions

      - name: Summarize published tags
        run: |
          {
            echo "### GHCR image"
            echo '```'
            cat "$RUNNER_TEMP/image-tags.txt"
            echo '```'
            echo
            echo "Platform: linux/amd64. Docker Hub and arm64 are not published."
            echo "The first push may create a private package. An owner must change that package to public once before anonymous docker pull works."
          } >> "$GITHUB_STEP_SUMMARY"
